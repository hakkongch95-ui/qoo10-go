<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Qoo10公式に移動中…</title>
<style>
  html,body{margin:0;height:100%;background:#fff}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;
       font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
       color:#222;text-align:center;padding:0 24px;box-sizing:border-box}
  .box{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;max-width:320px}
  .spin{width:40px;height:40px;border:4px solid #eee;border-top-color:#e8173c;border-radius:50%;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  .msg{font-size:20px;font-weight:700}
  .btn{display:block;width:100%;padding:14px 0;border-radius:10px;font-size:16px;font-weight:700;text-decoration:none}
  .app{background:#e8173c;color:#fff}
  .web{background:#f2f2f2;color:#333}
</style>
<script>
(function(){
  var WEB = "https://www.qoo10.jp/g/1103102572/";
  var GA_ID = "G-5FW9B64SSQ";
  var EVENT = "apptest";
  var enc = encodeURIComponent(WEB);
  var SCHEME = "qoo10jp://moveTab?url=" + enc;
  var INTENT = "intent://moveTab?url=" + enc + "#Intent;scheme=qoo10jp;package=net.giosis.shopping.jp;S.browser_fallback_url=" + enc + ";end";
  var ua = navigator.userAgent;
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  window.__links = { scheme: isAndroid ? INTENT : SCHEME, web: WEB };

  var started = false;
  function openApp(){
    if (started) return; started = true;
    if (isAndroid) {
      location.href = INTENT;
      setTimeout(function(){ if (!document.hidden) location.replace(WEB); }, 1500);
      return;
    }
    if (isIOS) {
      location.href = SCHEME;
      setTimeout(function(){ if (!document.hidden) location.replace(WEB); }, 1500);
      return;
    }
    location.replace(WEB);
  }

  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', GA_ID, { send_page_view: false });
  gtag('event', EVENT, { transport_type: 'beacon', event_callback: openApp });
  var s = document.createElement('script'); s.async = true;
  s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
  document.head.appendChild(s);
  setTimeout(openApp, 700);
})();
</script>
</head>
<body>
  <div class="box">
    <div class="spin" aria-hidden="true"></div>
    <div class="msg">Qoo10公式に移動中…</div>
    <a class="btn app" id="a" href="#">アプリで開く</a>
    <a class="btn web" id="w" href="https://www.qoo10.jp/g/1103102572/">ブラウザで開く</a>
  </div>
  <script>document.getElementById('a').href = window.__links.scheme;</script>
</body>
</html>
