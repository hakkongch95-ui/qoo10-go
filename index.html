<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Qoo10公式に移動中…</title>
<style>
  html,body{margin:0;height:100%;background:#fff}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;
       font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
       color:#222;text-align:center;padding:0 24px;box-sizing:border-box}
  .box{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;max-width:320px}
  .spin{width:40px;height:40px;border:4px solid #eee;border-top-color:#e8173c;border-radius:50%;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  .msg{font-size:20px;font-weight:700}
  .sub{font-size:13px;color:#888}.sub a{color:#888}
  .btn{display:block;width:100%;padding:14px 0;border-radius:10px;font-size:16px;font-weight:700;text-decoration:none}
  .app{background:#e8173c;color:#fff}.web{background:#f2f2f2;color:#333}
</style>
<script>
(function(){
  var DEST = "https://www.qoo10.jp/g/1103102572/";
  var GA_ID = "G-5FW9B64SSQ";
  function track(name){
    try{
      var cid; try{ cid = localStorage.getItem('_qg_cid'); }catch(e){}
      if(!cid){ cid = Math.floor(Math.random()*2147483647) + '.' + Math.floor(Date.now()/1000); try{ localStorage.setItem('_qg_cid', cid); }catch(e){} }
      var sid = Math.floor(Date.now()/1000);
      var q = ['v=2','tid='+GA_ID,'cid='+encodeURIComponent(cid),'_p='+Math.floor(Math.random()*1e9),
               'sid='+sid,'sct=1','seg=1','_s=1','_ss=1','_nsi=1',
               'ul='+encodeURIComponent((navigator.language||'').toLowerCase()),
               'sr='+screen.width+'x'+screen.height,
               'dl='+encodeURIComponent(location.href),'dr='+encodeURIComponent(document.referrer||''),
               'dt='+encodeURIComponent(document.title),'en='+encodeURIComponent(name),'_et=1'];
      var url = 'https://www.google-analytics.com/g/collect?' + q.join('&');
      if (!(navigator.sendBeacon && navigator.sendBeacon(url))) { fetch(url,{method:'POST',mode:'no-cors',keepalive:true}); }
    }catch(e){}
  }
  track("test_root");
  location.replace(DEST);
})();
</script>
</head>
<body>
  <div class="box">
    <div class="spin" aria-hidden="true"></div>
    <div class="msg">Qoo10公式に移動中…</div>
    <div class="sub"><a href="https://www.qoo10.jp/g/1103102572/">移動しない場合はこちら</a></div>
  </div>
</body>
</html>
